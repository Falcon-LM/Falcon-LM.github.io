<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dc-pipeline-title dc-pipeline-desc" id="dc-pipeline-root">
      <title id="dc-pipeline-title">Data Center Inspection Assistant pipeline</title>
      <desc id="dc-pipeline-desc">An inspection photo goes to Falcon-Perception, each detected document is cropped in the Gradio app and read by Falcon-OCR-Arabic (Falcon-OCR as the fallback), and Falcon-Emirati turns the texts into an answer and cited takeaways in Emirati Arabic.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dc-pipeline-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #615ced;
      --font-sans:     'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, Menlo, monospace; }
      #dc-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #dc-pipeline-root .scroll { overflow-x: auto; }</style>
        <pattern id="dc-pipeline-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
        <marker id="dc-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="dc-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#615ced"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dc-pipeline-dots)" opacity="0.55"/>

      <!-- Arrows (behind nodes) -->
      <line x1="272" y1="140" x2="366" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dc-pipeline-arrow)"/>
      <line x1="592" y1="140" x2="686" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dc-pipeline-arrow)"/>
      <line x1="836" y1="184" x2="836" y2="302" stroke="#615ced" stroke-width="1.4" marker-end="url(#dc-pipeline-arrow-accent)"/>
      <line x1="688" y1="348" x2="594" y2="348" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#dc-pipeline-arrow)"/>
      <path d="M160 184 L160 236 Q160 244 168 244 L756 244 Q764 244 764 252 L764 302" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#dc-pipeline-arrow)"/>

      <!-- Arrow labels -->
      <rect x="276" y="116" width="88" height="14" rx="2" fill="#f5f5f5"/>
      <text x="320" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">PHOTO + QUERY</text>
      <rect x="596" y="116" width="88" height="14" rx="2" fill="#f5f5f5"/>
      <text x="640" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">BOXES + MASKS</text>
      <rect x="842" y="222" width="88" height="14" rx="2" fill="#f5f5f5"/>
      <text x="846" y="232" fill="#615ced" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.08em">IMAGE PER DOC</text>
      <rect x="600" y="324" width="80" height="14" rx="2" fill="#f5f5f5"/>
      <text x="640" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">TEXT PER DOC</text>
      <rect x="420" y="220" width="80" height="14" rx="2" fill="#f5f5f5"/>
      <text x="460" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">FULL PHOTO</text>

      <!-- Node: inspection photo (input) -->
      <rect x="48" y="96" width="224" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="96" width="224" height="88" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="60" y="108" width="44" height="14" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="82" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.12em">INPUT</text>
      <text x="60" y="150" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, -apple-system, sans-serif">Inspection photo</text>
      <text x="60" y="170" fill="#7a8399" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace">checklist + report</text>

      <!-- Node: Falcon-Perception -->
      <rect x="368" y="96" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="380" y="108" width="40" height="14" rx="2" fill="none" stroke="#2e5aa8" stroke-width="0.8"/>
      <text x="400" y="118" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.12em">LIVE</text>
      <text x="380" y="150" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, -apple-system, sans-serif">Falcon-Perception</text>
      <text x="380" y="170" fill="#7a8399" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace">0.6B · gateway /segment</text>

      <!-- Node: Crop (focal) -->
      <rect x="688" y="96" width="224" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="96" width="224" height="88" rx="6" fill="#615ced" fill-opacity="0.08" stroke="#615ced" stroke-width="1.2"/>
      <rect x="700" y="108" width="72" height="14" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/>
      <text x="736" y="118" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.12em">GRADIO APP</text>
      <text x="700" y="150" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, -apple-system, sans-serif">Crop</text>
      <text x="700" y="170" fill="#7a8399" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace">one image per document</text>

      <!-- Node: Falcon-OCR-Arabic* -->
      <rect x="688" y="304" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="700" y="316" width="76" height="14" rx="2" fill="none" stroke="#7a8399" stroke-width="0.8"/>
      <text x="738" y="326" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.12em">INVITE ONLY</text>
      <text x="700" y="358" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, -apple-system, sans-serif">Falcon-OCR-Arabic*</text>
      <text x="700" y="378" fill="#7a8399" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace">270M · reads each crop</text>

      <!-- Node: Falcon-Emirati -->
      <rect x="368" y="304" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="380" y="316" width="76" height="14" rx="2" fill="none" stroke="#7a8399" stroke-width="0.8"/>
      <text x="418" y="326" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.12em">INVITE ONLY</text>
      <text x="380" y="358" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, -apple-system, sans-serif">Falcon-Emirati</text>
      <text x="380" y="378" fill="#7a8399" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace">7B · answer + cited takeaways</text>

      <!-- Legend strip -->
      <line x1="48" y1="432" x2="912" y2="432" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="48" y="450" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.18em">LEGEND · TAG SAYS WHERE IT RUNS</text>
      <rect x="48" y="464" width="32" height="14" rx="2" fill="none" stroke="#2e5aa8" stroke-width="0.8"/>
      <text x="64" y="474" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">LIVE</text>
      <text x="88" y="475" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, -apple-system, sans-serif">Public vision gateway</text>
      <rect x="228" y="464" width="68" height="14" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8"/>
      <text x="262" y="474" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">GRADIO APP</text>
      <text x="304" y="475" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, -apple-system, sans-serif">Inside the app</text>
      <rect x="408" y="464" width="68" height="14" rx="2" fill="none" stroke="#7a8399" stroke-width="0.8"/>
      <text x="442" y="474" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">INVITE ONLY</text>
      <text x="484" y="475" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, -apple-system, sans-serif">Needs an endpoint URL + key</text>
      <line x1="680" y1="471" x2="708" y2="471" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#dc-pipeline-arrow)"/>
      <text x="716" y="475" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, -apple-system, sans-serif">Whole-photo baseline</text>
      <text x="48" y="503" fill="#2d3142" font-size="10" font-family="'Geist', system-ui, -apple-system, sans-serif"><tspan font-weight="600">*</tspan> Without its URL and key, or once its request limit is reached, Falcon-OCR on the public gateway reads the crops instead.</text>
    </svg>
